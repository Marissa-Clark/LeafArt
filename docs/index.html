<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falling Leaves</title>
<meta name="description" content="A calm falling-leaf screensaver made from hand-scanned autumn leaves.">
<style>
  :root {
    --bg-inner: #1b1320;
    --bg-outer: #07060a;
    --text: rgba(255, 244, 230, 0.82);
    --text-dim: rgba(255, 244, 230, 0.5);
    --chip: rgba(255, 244, 230, 0.1);
    --panel: rgba(20, 14, 22, 0.82);
    --accent: #e8743b;
  }
  :root[data-bg="light"] {
    --bg-inner: #faf5ec;
    --bg-outer: #e9dfcf;
    --text: rgba(40, 28, 20, 0.85);
    --text-dim: rgba(40, 28, 20, 0.55);
    --chip: rgba(40, 28, 20, 0.08);
    --panel: rgba(255, 250, 242, 0.88);
    --accent: #b8471c;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--bg-inner), var(--bg-outer) 75%);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    transition: background 0.6s;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  body.idle { cursor: none; }

  .fade { transition: opacity 1s ease; }
  .fade.hidden { opacity: 0; pointer-events: none; }

  .hint {
    position: fixed; left: 16px; right: 72px; bottom: 22px;
    display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center;
    pointer-events: none;
  }
  .hint span { color: var(--text-dim); }
  kbd {
    font: inherit; font-size: 12px; color: var(--text);
    background: var(--chip); border-radius: 4px; padding: 1px 6px; margin-right: 4px;
  }

  .gear {
    position: fixed; right: 16px; bottom: 16px; width: 40px; height: 40px;
    border: 0; border-radius: 50%; background: var(--chip); color: var(--text);
    font-size: 20px; line-height: 40px; cursor: pointer;
  }
  .gear:focus-visible, .panel input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel {
    position: fixed; right: 16px; bottom: 66px; width: min(260px, calc(100vw - 32px));
    box-sizing: border-box; padding: 14px 16px; border-radius: 12px;
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: grid; gap: 12px;
  }
  .panel[hidden] { display: none; }
  .panel label { display: grid; gap: 4px; }
  .panel .row { display: flex; justify-content: space-between; color: var(--text-dim); }
  .panel .row output { color: var(--text); font-variant-numeric: tabular-nums; }
  .panel input[type="range"] { width: 100%; accent-color: var(--accent); }
  .panel .toggle { display: flex; align-items: center; gap: 8px; color: var(--text-dim); cursor: pointer; }
  .panel .toggle input { accent-color: var(--accent); }

  .loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: var(--text-dim); letter-spacing: 0.08em; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="loading fade" id="loading">gathering leaves…</div>

<div class="hint fade hidden" id="hint">
  <span><kbd>F</kbd>fullscreen</span>
  <span><kbd>Space</kbd>pause</span>
  <span><kbd>↑</kbd><kbd>↓</kbd>more / fewer leaves</span>
  <span><kbd>H</kbd>hide this</span>
</div>

<button class="gear fade hidden" id="gear" aria-label="Settings" aria-expanded="false" aria-controls="panel">⚙</button>
<div class="panel" id="panel" hidden>
  <label>
    <span class="row">Leaves <output id="count-out"></output></span>
    <input type="range" id="count" min="5" max="150" step="1">
  </label>
  <label>
    <span class="row">Speed <output id="speed-out"></output></span>
    <input type="range" id="speed" min="0.2" max="2.5" step="0.1">
  </label>
  <label class="toggle"><input type="checkbox" id="light"> Light background</label>
</div>

<script>
/*
 * Falling Leaves: every leaf here is a real scanned leaf (see ../README.md).
 *
 * URL options (override saved settings), e.g. index.html?count=30&speed=0.7&bg=light
 *   count  number of leaves on screen (default: scales with window size)
 *   speed  fall speed multiplier (default 1)
 *   size   leaf size multiplier (default 1)
 *   bg     dark | light
 *   hint   0 to never show the keyboard hint
 */
(() => {
  const params = new URLSearchParams(location.search);
  const num = (value, min, max) => {
    const v = parseFloat(value);
    return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : null;
  };

  // Settings the viewer changes in the panel are remembered per browser.
  // Storage can be unavailable (private mode, blocked cookies), so every
  // access is guarded and the page works fine without it.
  const STORE_KEY = "falling-leaves-settings";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { /* ignore */ }
  const save = () => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ count: countSetting, speed: speedSetting, bg: bgSetting }));
    } catch { /* ignore */ }
  };

  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sizeScale = num(params.get("size"), 0.3, 3) ?? 1;
  let speedSetting = num(params.get("speed"), 0.1, 4) ?? num(saved.speed, 0.1, 4) ?? 1;
  let countSetting = num(params.get("count"), 1, 300) ?? num(saved.count, 1, 300);  // null = automatic
  let bgSetting = params.get("bg") || saved.bg || "dark";
  const speedFactor = () => speedSetting * (reducedMotion ? 0.35 : 1);

  function applyBackground() {
    if (bgSetting === "light") document.documentElement.dataset.bg = "light";
    else delete document.documentElement.dataset.bg;
  }
  applyBackground();

  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d");
  let width = 0, height = 0, dpr = 1, baseSize = 100;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  // ---------------------------------------------------------------- sprites
  // All sprites load in the background; leaves draw from whatever has
  // arrived so far, so the scene starts quickly and gains variety over time.
  const sprites = [];

  async function loadSprites() {
    const manifest = await (await fetch("leaves.json")).json();
    for (let i = manifest.length - 1; i > 0; i--) {  // shuffle
      const j = (Math.random() * (i + 1)) | 0;
      [manifest[i], manifest[j]] = [manifest[j], manifest[i]];
    }
    let next = 0;
    const worker = async () => {
      while (next < manifest.length) {
        const entry = manifest[next++];
        const img = new Image();
        img.src = entry.src;
        try { await img.decode(); sprites.push(img); } catch { /* skip broken sprite */ }
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
  }

  // ----------------------------------------------------------------- breeze
  // The pointer's recent velocity, smoothed. It decays to zero when the
  // pointer stops, so a resting cursor leaves the scene undisturbed.
  const pointer = { x: -1e4, y: -1e4, vx: 0, vy: 0, t: 0 };

  function trackPointer(e) {
    const now = performance.now();
    const dt = Math.max(8, now - pointer.t) / 1000;
    if (pointer.t && now - pointer.t < 100) {
      const blend = 0.35;
      pointer.vx += ((e.clientX - pointer.x) / dt - pointer.vx) * blend;
      pointer.vy += ((e.clientY - pointer.y) / dt - pointer.vy) * blend;
    }
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.t = now;
  }

  // ----------------------------------------------------------------- leaves
  class Leaf {
    constructor(scatter) { this.reset(scatter); }

    reset(scatter) {
      this.img = pick(sprites);
      this.depth = rand(0.35, 1);                       // 1 = closest to the viewer
      const s = baseSize * this.depth * rand(0.8, 1.2);
      const aspect = this.img.naturalWidth / this.img.naturalHeight;
      this.w = aspect >= 1 ? s : s * aspect;
      this.h = aspect >= 1 ? s / aspect : s;
      this.x = rand(-0.1, 1.1) * width;
      this.y = scatter ? rand(-0.1, 1) * height : -rand(0.6, 2) * s;
      this.fall = rand(28, 48) * (0.5 + this.depth);    // px/s; near leaves fall faster
      this.swayAmp = rand(18, 55) * this.depth;
      this.swayFreq = rand(0.25, 0.6);
      this.swayPhase = rand(0, Math.PI * 2);
      this.angle = rand(0, Math.PI * 2);
      this.spin = rand(0.15, 0.7) * (Math.random() < 0.5 ? -1 : 1);
      this.flipFreq = reducedMotion ? 0 : rand(0.3, 1.1);
      this.flipPhase = rand(0, Math.PI * 2);
      this.pushX = this.pushY = this.pushSpin = 0;      // velocity added by the breeze
    }

    update(dt, t, wind) {
      const speed = speedFactor();
      const flip = Math.cos(this.flipPhase + t * this.flipFreq);
      // A leaf seen edge-on catches less air and drops a little faster.
      const drag = 0.75 + 0.45 * (1 - Math.abs(flip));

      // Breeze: leaves near a moving pointer pick up some of its velocity,
      // more when close and in the foreground, plus a little extra spin.
      const dx = this.x - pointer.x, dy = this.y - pointer.y;
      const reach = baseSize * 2.2;
      const dist = Math.hypot(dx, dy);
      if (dist < reach) {
        const falloff = (1 - dist / reach) ** 2 * this.depth;
        const gain = Math.min(1, dt * 6) * falloff * (reducedMotion ? 0.3 : 1);
        this.pushX += (pointer.vx * 0.6 - this.pushX) * gain;
        this.pushY += (pointer.vy * 0.6 - this.pushY) * gain;
        const across = (dx * pointer.vy - dy * pointer.vx) / (dist + 1);  // which way to twist
        this.pushSpin += across * 0.004 * gain;
      }
      const settle = Math.exp(-dt * 1.4);
      this.pushX *= settle;
      this.pushY *= settle;
      this.pushSpin *= settle;

      this.y += (this.fall * drag * speed + this.pushY) * dt;
      this.x += ((wind * this.depth +
                  Math.cos(this.swayPhase + t * this.swayFreq) * this.swayAmp * this.swayFreq) * speed +
                 this.pushX) * dt;
      this.angle += (this.spin * speed + this.pushSpin) * dt;
      this.flip = flip;

      const margin = Math.max(this.w, this.h);
      if (this.y > height + margin) this.reset(false);
      else if (this.y < -4 * margin) this.y = -margin, this.pushY = 0;  // blown off the top
      else if (this.x < -2 * margin) this.x += width + 3 * margin;
      else if (this.x > width + 2 * margin) this.x -= width + 3 * margin;
    }

    draw() {
      // Flatten the leaf horizontally as it tumbles to fake a 3D flip.
      const squash = Math.max(0.08, Math.abs(this.flip));
      ctx.globalAlpha = 0.35 + 0.65 * this.depth;
      ctx.setTransform(dpr, 0, 0, dpr, this.x * dpr, this.y * dpr);
      ctx.rotate(this.angle);
      ctx.scale(squash, 1);
      ctx.drawImage(this.img, -this.w / 2, -this.h / 2, this.w, this.h);
    }
  }

  let leaves = [];

  const autoCount = () => Math.round(Math.min(90, Math.max(12, (width * height) / 26000)));
  const targetCount = () => countSetting ?? autoCount();

  function syncLeafCount(scatter) {
    if (!sprites.length) return;
    const target = targetCount();
    while (leaves.length < target) leaves.push(new Leaf(scatter));
    if (leaves.length > target) leaves.length = target;
    leaves.sort((a, b) => a.depth - b.depth);  // far leaves are drawn first
  }

  // ------------------------------------------------------------------- wind
  // A few slow, incommensurate sine waves: a steady breeze with gusts.
  function windAt(t) {
    return (Math.sin(t * 0.07) * 18 + Math.sin(t * 0.19 + 1.3) * 10 +
            Math.max(0, Math.sin(t * 0.043 + 4)) ** 6 * 45) * (reducedMotion ? 0.3 : 1);
  }

  // ------------------------------------------------------------------- loop
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    baseSize = Math.min(150, Math.max(55, Math.min(width, height) * 0.12)) * sizeScale;
    syncLeafCount(true);
  }

  let paused = false;
  let simTime = 0;
  let last = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);  // clamp after tab switches
    last = now;
    const still = Math.exp(-dt * 8);
    pointer.vx *= still;
    pointer.vy *= still;
    if (!paused) {
      simTime += dt;
      const wind = windAt(simTime);
      for (const leaf of leaves) leaf.update(dt, simTime, wind);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const leaf of leaves) leaf.draw();
    requestAnimationFrame(frame);
  }

  // --------------------------------------------------------------- controls
  const hint = document.getElementById("hint");
  const gear = document.getElementById("gear");
  const panel = document.getElementById("panel");
  const countInput = document.getElementById("count");
  const speedInput = document.getElementById("speed");
  const lightInput = document.getElementById("light");
  let hintsOff = params.get("hint") === "0";
  let chromeTimer;

  // The hint and settings button appear on activity and fade when idle.
  function showChrome(duration = 3000) {
    document.body.classList.remove("idle");
    gear.classList.remove("hidden");
    if (!hintsOff) hint.classList.remove("hidden");
    clearTimeout(chromeTimer);
    chromeTimer = setTimeout(() => {
      if (!panel.hidden) return;  // keep everything up while settings are open
      hint.classList.add("hidden");
      gear.classList.add("hidden");
      document.body.classList.add("idle");
    }, duration);
  }

  function refreshPanel() {
    countInput.value = targetCount();
    document.getElementById("count-out").value = countSetting === null ? `${targetCount()} (auto)` : countSetting;
    speedInput.value = speedSetting;
    document.getElementById("speed-out").value = `${speedSetting.toFixed(1)}×`;
    lightInput.checked = bgSetting === "light";
  }

  function setPanelOpen(open) {
    panel.hidden = !open;
    gear.setAttribute("aria-expanded", String(open));
    if (open) refreshPanel();
    showChrome();
  }

  gear.addEventListener("click", () => setPanelOpen(panel.hidden));
  countInput.addEventListener("input", () => {
    countSetting = Number(countInput.value);
    syncLeafCount(false);
    refreshPanel();
    save();
  });
  speedInput.addEventListener("input", () => {
    speedSetting = Number(speedInput.value);
    refreshPanel();
    save();
  });
  lightInput.addEventListener("change", () => {
    bgSetting = lightInput.checked ? "light" : "dark";
    applyBackground();
    save();
  });
  // Keep the breeze and fullscreen shortcuts from firing inside the panel.
  panel.addEventListener("pointermove", e => e.stopPropagation());
  panel.addEventListener("dblclick", e => e.stopPropagation());

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  }

  addEventListener("keydown", e => {
    if (e.target instanceof HTMLInputElement) return;
    if (e.key === "f" || e.key === "F") toggleFullscreen();
    else if (e.key === " ") { paused = !paused; e.preventDefault(); }
    else if (e.key === "h" || e.key === "H") { hintsOff = true; hint.classList.add("hidden"); }
    else if (e.key === "Escape") setPanelOpen(false);
    else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      countSetting = Math.max(1, Math.min(300, targetCount() + (e.key === "ArrowUp" ? 5 : -5)));
      syncLeafCount(false);
      refreshPanel();
      save();
      e.preventDefault();
    }
  });
  canvas.addEventListener("dblclick", toggleFullscreen);
  canvas.addEventListener("pointerdown", () => { if (!panel.hidden) setPanelOpen(false); });
  addEventListener("pointermove", e => { trackPointer(e); showChrome(); });
  addEventListener("pointerleave", () => { pointer.x = pointer.y = -1e4; });
  addEventListener("resize", resize);

  // ------------------------------------------------------------------ start
  resize();
  const allLoaded = loadSprites();
  const waitForFirstSprites = new Promise(resolve => {
    const check = () => (sprites.length >= 12 ? resolve() : setTimeout(check, 50));
    check();
  });
  Promise.race([waitForFirstSprites, allLoaded]).then(() => {
    if (!sprites.length) {
      document.getElementById("loading").textContent = "could not load leaves";
      return;
    }
    syncLeafCount(true);
    document.getElementById("loading").classList.add("hidden");
    showChrome(5000);
    requestAnimationFrame(t => { last = t; frame(t); });
  });
})();
</script>
</body>
</html>
